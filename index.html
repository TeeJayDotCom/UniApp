<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniApp Dashboard</title>
    
    <!-- ExcelJS for Proper Excel Formatting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ========================================== */
        /* ORIGINAL XYZ STYLES (UNTOUCHED)            */
        /* ========================================== */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, sans-serif; background: #f8f9fa; transition: background 0.4s ease; }
        
        .app-frame { border: none; width: 100%; height: calc(100% - 70px); position: absolute; top: 0; left: 0; transition: opacity 0.3s ease; }
        #frame-a { z-index: 10; opacity: 1; pointer-events: auto; }
        #frame-b { z-index: 5; opacity: 0; pointer-events: none; }

        #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; display: flex; z-index: 100; transition: all 0.4s ease; padding-bottom: env(safe-area-inset-bottom); }
        
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .nav-btn i { font-size: 22px; margin-bottom: 4px; transition: transform 0.2s; }
        .nav-btn:active i { transform: scale(0.8); }

        .theme-light { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(0,0,0,0.1); }
        .theme-light .nav-btn { color: #94a3b8; }
        .theme-light .nav-btn.active { color: #4361ee; }

        .theme-dark { background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); }
        .theme-dark .nav-btn { color: #64748b; }
        .theme-dark .nav-btn.active { color: #00E676; text-shadow: 0 0 10px rgba(0,230,118,0.4); }

        /* ========================================== */
        /* LIGHT MODE SAMPLE CART UI (STOCKFLOW)      */
        /* ========================================== */
        :root {
            --sf-primary: #0A84FF;
            --sf-secondary: #5E5CE6;
            --sf-success: #00E676;
            --sf-danger: #ef476f;
            --sf-text: #1a1a2e;
            --sf-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        /* Top-Mid FAB with Original Blue Glow */
        #floating-sample-btn { 
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 9990; 
            background: linear-gradient(135deg, var(--sf-primary) 0%, var(--sf-secondary) 100%); 
            color: #fff; border: none; border-radius: 30px; padding: 12px 24px; 
            font-family: 'Inter', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.5px;
            box-shadow: 0 8px 25px rgba(10, 132, 255, 0.4); cursor: pointer; 
            display: flex; align-items: center; gap: 8px; transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        #floating-sample-btn:active { transform: translateX(-50%) scale(0.95); box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3); }

        /* Light Background Modal */
        #sample-cart-modal { 
            display: none; position: fixed; inset: 0; 
            background: linear-gradient(to bottom right, #f8f9fa, #e0f2fe); 
            font-family: 'Inter', sans-serif; z-index: 9999; overflow-y: auto; padding-bottom: 40px;
            animation: fadeIn 0.3s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* Clean Header */
        .sc-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 24px; position: sticky; top: 0; z-index: 100;
            background: rgba(248, 249, 250, 0.95); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid #e9ecef;
        }
        .sc-header h2 { 
            margin: 0; font-size: 22px; font-weight: 800; 
            color: var(--sf-text); letter-spacing: -0.5px;
        }
        .close-modal-btn { 
            background: #fff; color: #6c757d; border: 1px solid #e9ecef; 
            width: 40px; height: 40px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 18px; 
            cursor: pointer; box-shadow: var(--sf-shadow); transition: 0.2s;
        }
        .close-modal-btn:hover { color: var(--sf-danger); border-color: var(--sf-danger); }
        .close-modal-btn:active { transform: scale(0.9); }

        /* White Cards */
        .sc-card { 
            background: #ffffff; border-radius: 16px; padding: 20px; margin: 20px; 
            border: 1px solid rgba(0, 0, 0, 0.05); box-shadow: var(--sf-shadow);
            position: relative;
        }
        .sc-card-title { font-size: 14px; font-weight: 800; color: #6c757d; text-transform: uppercase; letter-spacing: 1px; margin: 0 0 16px 0; display: flex; align-items: center; gap: 8px; }

        /* Toggles */
        .toggle-group { display: flex; gap: 10px; margin-bottom: 20px; background: #f1f3f5; padding: 6px; border-radius: 14px; }
        .source-toggle { 
            flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; 
            border-radius: 10px; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; color: #6c757d; transition: all 0.3s; 
        }
        .source-toggle.active { background: #fff; color: var(--sf-primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* Modern Input */
        .sc-search-wrap { position: relative; z-index: 1000; }
        .sc-search-input { 
            width: 100%; padding: 14px 20px; font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 500;
            background: #f8f9fa; border: 2px solid transparent; border-radius: 12px; 
            box-sizing: border-box; outline: none; transition: 0.3s; color: var(--sf-text);
        }
        .sc-search-input:focus { border-color: var(--sf-primary); box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.15); background: #fff; }
        
        /* Floating Dropdown */
        #oop-suggestions { 
            position: absolute; top: 100%; left: 0; width: 100%; background: #fff; 
            border: 1px solid #e9ecef; border-radius: 12px; max-height: 50vh; overflow-y: auto; display: none; 
            z-index: 10000; box-shadow: 0 15px 35px rgba(0,0,0,0.1); margin-top: 8px; padding: 8px;
        }

        .suggestion-item { padding: 14px 16px; border-bottom: 1px solid #f1f3f5; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-radius: 8px; }
        .suggestion-item:hover { background: #f8f9fa; }
        .suggestion-item:last-child { border-bottom: none; }
        .sugg-name { flex: 1; margin-right: 15px; font-size: 14px; font-weight: 600; color: var(--sf-text); }
        .sugg-code { font-size: 12px; font-weight: 700; color: var(--sf-primary); background: #e0f2fe; padding: 6px 10px; border-radius: 8px; font-family: monospace; }

        /* Cart List */
        .sc-list-item { padding: 14px 0; border-bottom: 1px dashed #e9ecef; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        .sc-list-item:last-child { border-bottom: none; }
        .cart-name { font-weight: 600; color: var(--sf-text); }
        .cart-qty { font-weight: 800; color: var(--sf-primary); }
        
        /* Action Buttons */
        .sc-btn-primary { 
            background: linear-gradient(135deg, var(--sf-primary) 0%, var(--sf-secondary) 100%); color: white; border: none; 
            padding: 14px; font-family: 'Inter', sans-serif; font-size: 15px; width: 100%; margin-top: 15px; border-radius: 12px; 
            font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(10, 132, 255, 0.3); transition: 0.2s;
        }
        .sc-btn-primary:active { transform: translateY(2px); box-shadow: 0 4px 10px rgba(10, 132, 255, 0.3); }
        
        .sc-btn-success { background: rgba(0, 230, 118, 0.1); color: #00B259; border: 1px solid rgba(0, 230, 118, 0.2); border-radius: 12px; padding: 12px; font-weight: 700; font-family: 'Inter'; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .sc-btn-success:active { transform: scale(0.98); }

        .sc-btn-danger { background: rgba(239, 71, 111, 0.1); color: var(--sf-danger); border: 1px solid rgba(239, 71, 111, 0.2); border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .sc-btn-danger:active { transform: scale(0.98); }

        .sc-table { width: 100%; border-collapse: collapse; font-size: 13px; color: var(--sf-text); }
        .sc-table th { padding: 12px 8px; border-bottom: 2px solid #e9ecef; font-weight: 700; color: #6c757d; text-align: left; font-size: 12px; }
        .sc-table td { padding: 14px 8px; border-bottom: 1px solid #e9ecef; vertical-align: top; }

        /* Unified Light Overlay Prompt */
        #custom-prompt-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100005; align-items: center; justify-content: center; padding: 20px; font-family: 'Inter', sans-serif; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
        .prompt-box { background: #fff; width: 100%; max-width: 320px; border-radius: 16px; padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); text-align: center; }
        .prompt-title { margin-top: 0; color: var(--sf-text); font-size: 15px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px; }
        .prompt-desc { font-size: 14px; color: #6c757d; margin-bottom: 20px; font-weight: 500; line-height: 1.4; }
        .prompt-input { width: 100%; padding: 14px; border: 2px solid #e9ecef; background: #f8f9fa; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: 'Inter'; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.2s; text-align: center; color: var(--sf-text); }
        .prompt-input:focus { border-color: var(--sf-primary); background: #fff; }
        .prompt-btn-group { display: flex; gap: 10px; }
        .prompt-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 700; font-family: 'Inter'; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .prompt-btn-cancel { background: #f1f3f5; color: #495057; }
        .prompt-btn-confirm { background: var(--sf-primary); color: white; box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3); }
        .prompt-btn-confirm.danger { background: var(--sf-danger); box-shadow: 0 4px 15px rgba(239, 71, 111, 0.3); }
    </style>
</head>
<body>

    <iframe id="frame-a" class="app-frame" src="rm.html"></iframe>
    <iframe id="frame-b" class="app-frame" src="fg.html"></iframe>

    <nav id="bottom-nav" class="theme-light">
        <button id="btn-a" class="nav-btn active" onclick="switchApp('a')">
            <i class="fas fa-boxes-stacked"></i>
            <span>Raw Materials</span>
        </button>
        <button id="btn-b" class="nav-btn" onclick="switchApp('b')">
            <i class="fas fa-fingerprint"></i>
            <span>FG Vault</span>
        </button>
    </nav>
    
    <!-- Top-Mid FAB with Original Blue Glow -->
    <button id="floating-sample-btn" onclick="document.getElementById('sample-cart-modal').style.display='block'">
        <i class="fas fa-box-open text-lg"></i>
        <span>Samples</span>
    </button>

    <!-- Main Light StockFlow-style Modal -->
    <div id="sample-cart-modal">
        <div class="sc-header">
            <h2>Dispatch Samples</h2>
            <button class="close-modal-btn" onclick="document.getElementById('sample-cart-modal').style.display='none'">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="sc-card">
            <h3 class="sc-card-title"><i class="fas fa-search text-blue-500"></i> Source & Search</h3>
            <div class="toggle-group">
                <button id="toggle-rm" class="source-toggle active">Raw Materials</button>
                <button id="toggle-fg" class="source-toggle">FG Vault</button>
            </div>
            <div class="sc-search-wrap">
                <input type="text" id="oop-search-input" class="sc-search-input" placeholder="Search product name or code...">
                <div id="oop-suggestions"></div>
            </div>
        </div>

        <div class="sc-card" id="cart-container" style="display: none;">
            <h3 class="sc-card-title"><i class="fas fa-shopping-cart text-purple-500"></i> Current Cart</h3>
            <ul id="oop-cart-list" style="list-style-type: none; padding: 0; margin: 0;"></ul>
            <button id="oop-finalise-btn" class="sc-btn-primary">
                Finalise & Enter Customer
            </button>
        </div>

        <div class="sc-card">
            <h3 class="sc-card-title"><i class="fas fa-history text-green-500"></i> Dispatched Records</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button id="oop-export-btn" class="sc-btn-success" style="flex: 3;">
                    <i class="fas fa-file-excel"></i> Download Excel
                </button>
                <button onclick="sampleApp.clearHistory()" class="sc-btn-danger" style="flex: 1;">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div style="overflow-x: auto;">
                <table class="sc-table">
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Customer</th>
                            <th>Items</th>
                        </tr>
                    </thead>
                    <tbody id="oop-saved-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Unified Light Prompt Overlay (No Website URLs) -->
    <div id="custom-prompt-overlay">
        <div class="prompt-box">
            <h3 id="prompt-title" class="prompt-title">TITLE</h3>
            <p id="prompt-desc" class="prompt-desc">Desc</p>
            <input type="text" id="prompt-input" class="prompt-input" autocomplete="off">
            <div class="prompt-btn-group">
                <button id="prompt-cancel" class="prompt-btn prompt-btn-cancel">Cancel</button>
                <button id="prompt-confirm" class="prompt-btn prompt-btn-confirm">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        function switchApp(app) {
            const frameA = document.getElementById('frame-a');
            const frameB = document.getElementById('frame-b');
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            const nav = document.getElementById('bottom-nav');

            if (app === 'a') {
                frameA.style.opacity = '1'; frameA.style.pointerEvents = 'auto'; frameA.style.zIndex = '10';
                frameB.style.opacity = '0'; frameB.style.pointerEvents = 'none'; frameB.style.zIndex = '5';
                btnA.classList.add('active'); btnB.classList.remove('active');
                nav.className = 'theme-light';
                document.body.style.background = '#f8f9fa';
            } else {
                frameB.style.opacity = '1'; frameB.style.pointerEvents = 'auto'; frameB.style.zIndex = '10';
                frameA.style.opacity = '0'; frameA.style.pointerEvents = 'none'; frameA.style.zIndex = '5';
                btnB.classList.add('active'); btnA.classList.remove('active');
                nav.className = 'theme-dark';
                document.body.style.background = '#000000';
            }
        }
    </script>

    <script>
        class SampleCartApp {
            constructor() {
                this.cart = []; 
                this.savedOrders = JSON.parse(localStorage.getItem('sample_orders_db')) || [];
                this.currentSource = 'RM'; 

                this.searchInput = document.getElementById('oop-search-input');
                this.suggestionsBox = document.getElementById('oop-suggestions');
                this.cartContainer = document.getElementById('cart-container');
                this.cartList = document.getElementById('oop-cart-list');
                this.finaliseBtn = document.getElementById('oop-finalise-btn');
                this.savedTableBody = document.getElementById('oop-saved-table-body');
                this.exportBtn = document.getElementById('oop-export-btn');
                
                this.btnRM = document.getElementById('toggle-rm');
                this.btnFG = document.getElementById('toggle-fg');

                this.promptOverlay = document.getElementById('custom-prompt-overlay');
                this.promptTitle = document.getElementById('prompt-title');
                this.promptDesc = document.getElementById('prompt-desc');
                this.promptInput = document.getElementById('prompt-input');
                this.promptCancel = document.getElementById('prompt-cancel');
                this.promptConfirm = document.getElementById('prompt-confirm');
                
                this.confirmCallback = null;

                this.initEvents();
                this.renderSavedOrders();
            }

            initEvents() {
                this.searchInput.addEventListener('input', (e) => this.handleSearch(e.target.value));
                this.finaliseBtn.addEventListener('click', () => this.finaliseOrder());
                this.exportBtn.addEventListener('click', () => this.exportToExcel());
                
                this.btnRM.addEventListener('click', () => this.switchSource('RM'));
                this.btnFG.addEventListener('click', () => this.switchSource('FG'));

                // Click outside to hide search suggestions
                document.addEventListener('click', (e) => {
                    if (e.target !== this.searchInput && !this.suggestionsBox.contains(e.target)) {
                        this.suggestionsBox.style.display = 'none';
                    }
                });
            }

            // Custom UI Prompt Function (With Input)
            showCustomPrompt(title, desc, placeholder, callback) {
                this.promptTitle.innerText = title;
                this.promptTitle.style.color = 'var(--sf-primary)';
                this.promptDesc.innerHTML = desc;
                this.promptInput.style.display = 'block';
                this.promptInput.placeholder = placeholder;
                this.promptInput.value = '';
                
                this.promptConfirm.className = 'prompt-btn prompt-btn-confirm';
                
                this.promptOverlay.style.display = 'flex';
                this.promptInput.focus();

                const handleConfirm = () => {
                    const val = this.promptInput.value.trim();
                    if (val) {
                        close();
                        if (callback) callback(val);
                    } else {
                        this.promptInput.style.borderColor = 'var(--sf-danger)';
                    }
                };

                const close = () => {
                    this.promptOverlay.style.display = 'none';
                    this.promptConfirm.removeEventListener('click', handleConfirm);
                    this.promptCancel.removeEventListener('click', close);
                    this.promptInput.onkeyup = null;
                    this.promptInput.style.borderColor = '#e9ecef';
                };

                this.promptInput.onkeyup = (e) => { if (e.key === 'Enter') handleConfirm(); };
                this.promptConfirm.addEventListener('click', handleConfirm);
                this.promptCancel.addEventListener('click', close);
            }

            // Custom UI Confirm Function (No Input, replaces standard confirm())
            showCustomConfirm(title, desc, callback) {
                this.promptTitle.innerText = title;
                this.promptTitle.style.color = 'var(--sf-danger)';
                this.promptDesc.innerText = desc;
                this.promptInput.style.display = 'none'; 
                
                this.promptConfirm.className = 'prompt-btn prompt-btn-confirm danger';
                
                this.promptOverlay.style.display = 'flex';

                const handleConfirm = () => {
                    close();
                    if (callback) callback();
                };

                const close = () => {
                    this.promptOverlay.style.display = 'none';
                    this.promptConfirm.removeEventListener('click', handleConfirm);
                    this.promptCancel.removeEventListener('click', close);
                };

                this.promptConfirm.addEventListener('click', handleConfirm);
                this.promptCancel.addEventListener('click', close);
            }

            switchSource(source) {
                this.currentSource = source;
                this.searchInput.value = '';
                this.suggestionsBox.style.display = 'none';
                
                if (source === 'RM') {
                    this.btnRM.classList.add('active'); this.btnFG.classList.remove('active');
                } else {
                    this.btnFG.classList.add('active'); this.btnRM.classList.remove('active');
                }
            }

            getDatabaseBySource() {
                let db = [];
                if (this.currentSource === 'RM') {
                    try {
                        const frameA = document.getElementById('frame-a').contentWindow;
                        const rmInventory = frameA.eval('AppState.inventory');
                        if (rmInventory) {
                            db = rmInventory.map(item => ({
                                name: item.name || 'Unknown',
                                code: item.code || 'N/A',
                                searchStr: (item.searchableText || item.name + ' ' + item.code).toLowerCase()
                            }));
                        }
                    } catch(e) {}
                } else {
                    try {
                        const frameB = document.getElementById('frame-b').contentWindow;
                        const fgInventory = frameB.eval('app.db');
                        if (fgInventory) {
                            db = fgInventory.map(item => ({
                                name: item.name || 'Unknown',
                                code: item.code || 'N/A',
                                searchStr: (item.searchIndex || item.name + ' ' + item.code).toLowerCase()
                            }));
                        }
                    } catch(e) {}
                }
                return db;
            }

            handleSearch(query) {
                query = query.toLowerCase().trim();
                this.suggestionsBox.innerHTML = '';
                
                if (!query) {
                    this.suggestionsBox.style.display = 'none';
                    return;
                }

                const searchTerms = query.split(/\s+/).filter(term => term.length > 0);
                const liveDatabase = this.getDatabaseBySource();
                
                const matches = liveDatabase.filter(p => {
                    return searchTerms.every(term => p.searchStr.includes(term));
                });

                if (matches.length > 0) {
                    this.suggestionsBox.style.display = 'block';
                    matches.forEach(match => {
                        let div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerHTML = `
                            <span class="sugg-name">${match.name}</span> 
                            <span class="sugg-code">${match.code}</span>
                        `;
                        div.addEventListener('click', () => this.promptQuantity(match.name, match.code));
                        this.suggestionsBox.appendChild(div);
                    });
                } else {
                    this.suggestionsBox.style.display = 'none';
                }
            }

            promptQuantity(productName, productCode) {
                this.showCustomPrompt(
                    "ASSIGN QUANTITY",
                    `<span style="color:var(--sf-text);">${productName}</span><br><span style="color:#6c757d; font-family:monospace; font-size: 13px;">${productCode}</span>`,
                    "e.g., 2pc, 100ml...",
                    (qty) => {
                        this.cart.push({ name: `${productName} [${productCode}]`, quantity: qty });
                        this.updateCartUI();
                        this.searchInput.value = '';
                        this.suggestionsBox.style.display = 'none';
                    }
                );
            }

            updateCartUI() {
                this.cartList.innerHTML = '';
                this.cart.forEach(item => {
                    let li = document.createElement('li');
                    li.className = 'sc-list-item';
                    li.innerHTML = `<span class="cart-name">${item.name}</span> <span class="cart-qty">${item.quantity}</span>`;
                    this.cartList.appendChild(li);
                });
                
                if (this.cart.length > 0) {
                    this.cartContainer.style.display = 'block';
                } else {
                    this.cartContainer.style.display = 'none';
                }
            }

            finaliseOrder() {
                this.showCustomPrompt(
                    "FINALISE SAMPLES",
                    "Enter the name of the customer:",
                    "Customer Name...",
                    (customerName) => {
                        const newOrder = {
                            id: Date.now(),
                            dateTime: new Date().toLocaleDateString('en-GB') + ', ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: true }),
                            customer: customerName,
                            items: [...this.cart] 
                        };
                        this.savedOrders.push(newOrder);
                        localStorage.setItem('sample_orders_db', JSON.stringify(this.savedOrders));
                        this.cart = [];
                        this.updateCartUI();
                        this.renderSavedOrders();
                    }
                );
            }

            renderSavedOrders() {
                this.savedTableBody.innerHTML = '';
                let displayOrders = [...this.savedOrders].reverse();
                displayOrders.forEach(order => {
                    let itemsString = order.items.map(i => `${i.name} (<strong style="color:var(--sf-primary);">${i.quantity}</strong>)`).join('<br>');
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color: #6c757d;">${order.dateTime}</td>
                        <td style="font-weight: 700; color: var(--sf-text);">${order.customer}</td>
                        <td style="line-height: 1.6;">${itemsString}</td>
                    `;
                    this.savedTableBody.appendChild(tr);
                });
            }

            async exportToExcel() {
                if (this.savedOrders.length === 0) return;
                
                let exportData = [];
                let latestCustomer = "Customer";
                
                if (this.savedOrders.length > 0) {
                    latestCustomer = this.savedOrders[this.savedOrders.length - 1].customer.replace(/[^a-zA-Z0-9 ]/g, "").trim();
                }

                this.savedOrders.forEach(order => {
                    order.items.forEach(item => {
                        exportData.push([
                            order.dateTime,
                            order.customer,
                            item.name,
                            item.quantity
                        ]);
                    });
                });

                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('Samples');

                worksheet.addTable({
                    name: 'SamplesTable',
                    ref: 'A1',
                    headerRow: true,
                    totalsRow: false,
                    style: { theme: 'TableStyleMedium2', showRowStripes: true },
                    columns: [
                        { name: 'Date & Time', filterButton: true },
                        { name: 'Customer Name', filterButton: true },
                        { name: 'Product Name & Code', filterButton: true },
                        { name: 'Quantity', filterButton: true },
                    ],
                    rows: exportData,
                });

                worksheet.columns.forEach(column => {
                    let maxLength = 0;
                    column.eachCell({ includeEmpty: true }, cell => {
                        let columnLength = cell.value ? cell.value.toString().length : 10;
                        if (columnLength > maxLength) maxLength = columnLength;
                    });
                    column.width = maxLength + 3; 
                });

                await worksheet.protect('zz', {
                    selectLockedCells: true, selectUnlockedCells: true,
                    formatCells: false, formatColumns: false, formatRows: false,
                    insertColumns: false, insertRows: false, deleteColumns: false,
                    deleteRows: false, sort: false, autoFilter: true 
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const dateStr = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
                const fileName = `${latestCustomer} Samples ${dateStr}.xlsx`;
                
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
            }

            clearHistory() {
                this.showCustomConfirm(
                    "DELETE HISTORY",
                    "Are you sure you want to clear all dispatched samples? This cannot be undone.",
                    () => {
                        this.savedOrders = [];
                        localStorage.removeItem('sample_orders_db');
                        this.renderSavedOrders();
                    }
                );
            }
        }

        const sampleApp = new SampleCartApp();
    </script>
</body>
</html>
