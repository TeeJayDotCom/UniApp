<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UniApp Dashboard</title>
    
    <!-- ExcelJS for Proper Excel Formatting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ========================================== */
        /* ORIGINAL XYZ STYLES (UNTOUCHED)            */
        /* ========================================== */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; background: #f8f9fa; transition: background 0.4s ease; }
        
        .app-frame { border: none; width: 100%; height: calc(100% - 70px); position: absolute; top: 0; left: 0; transition: opacity 0.3s ease; }
        #frame-a { z-index: 10; opacity: 1; pointer-events: auto; }
        #frame-b { z-index: 5; opacity: 0; pointer-events: none; }

        #bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 70px; display: flex; z-index: 100; transition: all 0.4s ease; padding-bottom: env(safe-area-inset-bottom); }
        
        .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: none; border: none; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .nav-btn i { font-size: 22px; margin-bottom: 4px; transition: transform 0.2s; }
        .nav-btn:active i { transform: scale(0.8); }

        .theme-light { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(0,0,0,0.1); }
        .theme-light .nav-btn { color: #94a3b8; }
        .theme-light .nav-btn.active { color: #4361ee; }

        .theme-dark { background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid rgba(255,255,255,0.1); }
        .theme-dark .nav-btn { color: #64748b; }
        .theme-dark .nav-btn.active { color: #00E676; text-shadow: 0 0 10px rgba(0,230,118,0.4); }

        /* ========================================== */
        /* ULTRA-MODERN FUTURISTIC SAMPLE CART UI     */
        /* ========================================== */
        :root {
            --neon-green: #00E676;
            --neon-blue: #0A84FF;
            --dark-glass: rgba(15, 15, 20, 0.75);
            --darker-glass: rgba(10, 10, 15, 0.9);
            --border-glow: rgba(0, 230, 118, 0.4);
        }

        /* Top-Mid Floating Button */
        #floating-sample-btn { 
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%); z-index: 9990; 
            background: rgba(10, 10, 15, 0.85); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 30px; 
            padding: 10px 24px; font-weight: 800; font-size: 13px; letter-spacing: 1px; text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 10px rgba(255,255,255,0.05); cursor: pointer; 
            display: flex; align-items: center; gap: 8px; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #floating-sample-btn:hover { border-color: var(--neon-green); box-shadow: 0 0 15px var(--border-glow), inset 0 0 10px rgba(0,0,0,0.5); color: var(--neon-green); }
        #floating-sample-btn:active { transform: translateX(-50%) scale(0.92); }

        /* Full Screen Dark Modal */
        #sample-cart-modal { 
            display: none; position: fixed; inset: 0; 
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            z-index: 9999; overflow-y: auto; padding-bottom: 40px; color: #fff;
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: scale(1); } }

        /* Header */
        .sc-header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px 24px; position: sticky; top: 0; z-index: 100;
            background: linear-gradient(to bottom, rgba(5,5,8,1) 0%, rgba(5,5,8,0.8) 100%);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .sc-header h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: 1px; background: linear-gradient(90deg, #fff, #aaa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .close-modal-btn { 
            background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); 
            width: 36px; height: 36px; border-radius: 50%; display: flex; 
            align-items: center; justify-content: center; font-size: 14px; 
            cursor: pointer; transition: 0.2s;
        }
        .close-modal-btn:hover { background: rgba(239, 71, 111, 0.2); color: #ef476f; border-color: #ef476f; }
        .close-modal-btn:active { transform: scale(0.9); }

        /* Futuristic Cards - Removed overflow:hidden to fix search bug */
        .sc-card { 
            background: var(--dark-glass); border-radius: 24px; padding: 24px; margin: 20px; 
            border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative;
        }
        .sc-card-title { font-size: 12px; font-weight: 900; color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; margin-top: 0; display: flex; align-items: center; gap: 8px; }

        /* Futuristic Toggles */
        .toggle-group { display: flex; gap: 8px; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 16px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .source-toggle { 
            flex: 1; padding: 12px; border: none; background: transparent; cursor: pointer; 
            border-radius: 12px; font-weight: 700; font-size: 13px; color: #777; transition: all 0.3s; text-transform: uppercase; letter-spacing: 1px;
        }
        .source-toggle.active { background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%); color: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }

        /* Search Input */
        .sc-search-wrap { position: relative; z-index: 1000; }
        .sc-search-input { 
            width: 100%; padding: 16px 20px; font-size: 16px; font-weight: 600;
            background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; 
            box-sizing: border-box; outline: none; transition: 0.3s; color: #fff;
        }
        .sc-search-input::placeholder { color: #555; }
        .sc-search-input:focus { background: rgba(0,0,0,0.8); border-color: var(--neon-blue); box-shadow: 0 0 20px rgba(10, 132, 255, 0.2); }
        
        /* Fixed Dropdown */
        #oop-suggestions { 
            position: absolute; top: 100%; left: 0; width: 100%; background: var(--darker-glass); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; max-height: 50vh; overflow-y: auto; display: none; 
            z-index: 100000; box-shadow: 0 20px 50px rgba(0,0,0,0.8); margin-top: 8px; padding: 8px;
        }

        .suggestion-item { padding: 14px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: 0.2s; border-radius: 8px; }
        .suggestion-item:hover { background: rgba(255,255,255,0.1); }
        .suggestion-item:last-child { border-bottom: none; }
        .sugg-name { flex: 1; margin-right: 15px; font-size: 14px; font-weight: 600; color: #eee; }
        .sugg-code { font-size: 12px; font-weight: 800; color: var(--neon-blue); background: rgba(10, 132, 255, 0.1); padding: 4px 8px; border-radius: 6px; font-family: monospace; border: 1px solid rgba(10, 132, 255, 0.2); }

        /* Cart List */
        .sc-list-item { padding: 16px 0; border-bottom: 1px dashed rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .sc-list-item:last-child { border-bottom: none; }
        .cart-name { font-weight: 600; color: #ddd; font-size: 14px; }
        .cart-qty { font-weight: 900; color: var(--neon-green); font-size: 16px; text-shadow: 0 0 10px rgba(0,230,118,0.3); }
        
        /* Action Buttons */
        .sc-btn-primary { 
            background: linear-gradient(135deg, var(--neon-green) 0%, #00B259 100%); color: #000; border: none; 
            padding: 16px; font-size: 14px; width: 100%; margin-top: 10px; border-radius: 16px; text-transform: uppercase; letter-spacing: 1px;
            font-weight: 900; cursor: pointer; box-shadow: 0 10px 30px rgba(0, 230, 118, 0.3); transition: 0.2s;
        }
        .sc-btn-primary:active { transform: scale(0.98); }

        .sc-table { width: 100%; border-collapse: collapse; font-size: 13px; color: #ddd; }
        .sc-table th { padding: 12px 8px; border-bottom: 2px solid rgba(255,255,255,0.1); font-weight: 800; color: #888; text-align: left; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }
        .sc-table td { padding: 16px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); vertical-align: top; }
        .sc-table td strong { color: #fff; }

        /* Custom Dark Prompt Overlay */
        #custom-prompt-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100005; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .prompt-box { background: var(--darker-glass); border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 320px; border-radius: 24px; padding: 24px; box-shadow: 0 30px 60px rgba(0,0,0,0.9); text-align: center; color: #fff; }
        .prompt-title { margin-top: 0; color: var(--neon-blue); font-size: 13px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 12px; }
        .prompt-desc { font-size: 15px; color: #ccc; margin-bottom: 20px; font-weight: 600; line-height: 1.5; }
        .prompt-input { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.5); border-radius: 12px; font-size: 16px; font-weight: 700; color: #fff; margin-bottom: 20px; box-sizing: border-box; outline: none; transition: 0.2s; text-align: center; }
        .prompt-input:focus { border-color: var(--neon-green); box-shadow: 0 0 15px rgba(0,230,118,0.2); }
        .prompt-btn-group { display: flex; gap: 10px; }
        .prompt-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 13px; text-transform: uppercase; transition: 0.2s; letter-spacing: 1px; }
        .prompt-btn-cancel { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .prompt-btn-confirm { background: var(--neon-blue); color: #fff; box-shadow: 0 5px 20px rgba(10, 132, 255, 0.4); }
        .prompt-btn-confirm.green { background: var(--neon-green); color: #000; box-shadow: 0 5px 20px rgba(0, 230, 118, 0.4); }
    </style>
</head>
<body>

    <iframe id="frame-a" class="app-frame" src="rm.html"></iframe>
    <iframe id="frame-b" class="app-frame" src="fg.html"></iframe>

    <nav id="bottom-nav" class="theme-light">
        <button id="btn-a" class="nav-btn active" onclick="switchApp('a')">
            <i class="fas fa-boxes-stacked"></i>
            <span>Raw Materials</span>
        </button>
        <button id="btn-b" class="nav-btn" onclick="switchApp('b')">
            <i class="fas fa-fingerprint"></i>
            <span>FG Vault</span>
        </button>
    </nav>
    
    <!-- Top-Mid FAB -->
    <button id="floating-sample-btn" onclick="document.getElementById('sample-cart-modal').style.display='block'">
        <i class="fas fa-satellite-dish"></i>
        <span>Samples</span>
    </button>

    <!-- Main Futuristic Modal -->
    <div id="sample-cart-modal">
        <div class="sc-header">
            <h2>DISPATCH SYS</h2>
            <button class="close-modal-btn" onclick="document.getElementById('sample-cart-modal').style.display='none'">
                <i class="fas fa-times"></i>
            </button>
        </div>
        
        <div class="sc-card">
            <h3 class="sc-card-title"><i class="fas fa-radar text-blue-500"></i> SOURCE LOCATOR</h3>
            <div class="toggle-group">
                <button id="toggle-rm" class="source-toggle active">Raw Materials</button>
                <button id="toggle-fg" class="source-toggle">FG Vault</button>
            </div>
            <div class="sc-search-wrap">
                <input type="text" id="oop-search-input" class="sc-search-input" placeholder="Enter parameters...">
                <div id="oop-suggestions"></div>
            </div>
        </div>

        <div class="sc-card" id="cart-container" style="display: none;">
            <h3 class="sc-card-title" style="color: var(--neon-green);"><i class="fas fa-layer-group"></i> ACTIVE PAYLOAD</h3>
            <ul id="oop-cart-list" style="list-style-type: none; padding: 0; margin: 0;"></ul>
            <button id="oop-finalise-btn" class="sc-btn-primary">
                Finalise Payload
            </button>
        </div>

        <div class="sc-card">
            <h3 class="sc-card-title"><i class="fas fa-server"></i> TRANSMITTED LOGS</h3>
            <div style="display: flex; gap: 10px; margin-bottom: 24px;">
                <button id="oop-export-btn" style="flex: 3; background: rgba(10, 132, 255, 0.15); color: var(--neon-blue); border: 1px solid rgba(10, 132, 255, 0.3); border-radius: 12px; padding: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; font-size: 12px; display: flex; align-items: center; justify-content: center; gap: 8px;">
                    <i class="fas fa-download"></i> Extract XML
                </button>
                <button onclick="sampleApp.clearHistory()" style="flex: 1; background: rgba(239, 71, 111, 0.15); color: #ef476f; border: 1px solid rgba(239, 71, 111, 0.3); border-radius: 12px; padding: 12px; cursor: pointer;">
                    <i class="fas fa-trash-alt"></i>
                </button>
            </div>
            <div style="overflow-x: auto;">
                <table class="sc-table">
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Target Entity</th>
                            <th>Payload Data</th>
                        </tr>
                    </thead>
                    <tbody id="oop-saved-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Unified Dark Overlay -->
    <div id="custom-prompt-overlay">
        <div class="prompt-box">
            <h3 id="prompt-title" class="prompt-title">SYSTEM PROMPT</h3>
            <p id="prompt-desc" class="prompt-desc">Desc</p>
            <input type="text" id="prompt-input" class="prompt-input" autocomplete="off">
            <div class="prompt-btn-group">
                <button id="prompt-cancel" class="prompt-btn prompt-btn-cancel">Abort</button>
                <button id="prompt-confirm" class="prompt-btn prompt-btn-confirm">Execute</button>
            </div>
        </div>
    </div>

    <script>
        function switchApp(app) {
            const frameA = document.getElementById('frame-a');
            const frameB = document.getElementById('frame-b');
            const btnA = document.getElementById('btn-a');
            const btnB = document.getElementById('btn-b');
            const nav = document.getElementById('bottom-nav');

            if (app === 'a') {
                frameA.style.opacity = '1'; frameA.style.pointerEvents = 'auto'; frameA.style.zIndex = '10';
                frameB.style.opacity = '0'; frameB.style.pointerEvents = 'none'; frameB.style.zIndex = '5';
                btnA.classList.add('active'); btnB.classList.remove('active');
                nav.className = 'theme-light';
                document.body.style.background = '#f8f9fa';
            } else {
                frameB.style.opacity = '1'; frameB.style.pointerEvents = 'auto'; frameB.style.zIndex = '10';
                frameA.style.opacity = '0'; frameA.style.pointerEvents = 'none'; frameA.style.zIndex = '5';
                btnB.classList.add('active'); btnA.classList.remove('active');
                nav.className = 'theme-dark';
                document.body.style.background = '#000000';
            }
        }
    </script>

    <script>
        class SampleCartApp {
            constructor() {
                this.cart = []; 
                this.savedOrders = JSON.parse(localStorage.getItem('sample_orders_db')) || [];
                this.currentSource = 'RM'; 

                this.searchInput = document.getElementById('oop-search-input');
                this.suggestionsBox = document.getElementById('oop-suggestions');
                this.cartContainer = document.getElementById('cart-container');
                this.cartList = document.getElementById('oop-cart-list');
                this.finaliseBtn = document.getElementById('oop-finalise-btn');
                this.savedTableBody = document.getElementById('oop-saved-table-body');
                this.exportBtn = document.getElementById('oop-export-btn');
                
                this.btnRM = document.getElementById('toggle-rm');
                this.btnFG = document.getElementById('toggle-fg');

                this.promptOverlay = document.getElementById('custom-prompt-overlay');
                this.promptTitle = document.getElementById('prompt-title');
                this.promptDesc = document.getElementById('prompt-desc');
                this.promptInput = document.getElementById('prompt-input');
                this.promptCancel = document.getElementById('prompt-cancel');
                this.promptConfirm = document.getElementById('prompt-confirm');
                
                this.confirmCallback = null;

                this.initEvents();
                this.renderSavedOrders();
            }

            initEvents() {
                this.searchInput.addEventListener('input', (e) => this.handleSearch(e.target.value));
                this.finaliseBtn.addEventListener('click', () => this.finaliseOrder());
                this.exportBtn.addEventListener('click', () => this.exportToExcel());
                
                this.btnRM.addEventListener('click', () => this.switchSource('RM'));
                this.btnFG.addEventListener('click', () => this.switchSource('FG'));

                document.addEventListener('click', (e) => {
                    if (e.target !== this.searchInput && !this.suggestionsBox.contains(e.target)) {
                        this.suggestionsBox.style.display = 'none';
                    }
                });
            }

            showCustomPrompt(title, desc, placeholder, isGreenBtn, callback) {
                this.promptTitle.innerText = title;
                this.promptTitle.style.color = isGreenBtn ? 'var(--neon-green)' : 'var(--neon-blue)';
                this.promptDesc.innerHTML = desc;
                this.promptInput.style.display = 'block';
                this.promptInput.placeholder = placeholder;
                this.promptInput.value = '';
                
                this.promptConfirm.className = 'prompt-btn prompt-btn-confirm';
                if (isGreenBtn) this.promptConfirm.classList.add('green');
                
                this.promptOverlay.style.display = 'flex';
                this.promptInput.focus();

                const handleConfirm = () => {
                    const val = this.promptInput.value.trim();
                    if (val) {
                        close();
                        if (callback) callback(val);
                    } else {
                        this.promptInput.style.borderColor = '#ef476f';
                    }
                };

                const close = () => {
                    this.promptOverlay.style.display = 'none';
                    this.promptConfirm.removeEventListener('click', handleConfirm);
                    this.promptCancel.removeEventListener('click', close);
                    this.promptInput.onkeyup = null;
                    this.promptInput.style.borderColor = 'rgba(255,255,255,0.2)';
                };

                this.promptInput.onkeyup = (e) => { if (e.key === 'Enter') handleConfirm(); };
                this.promptConfirm.addEventListener('click', handleConfirm);
                this.promptCancel.addEventListener('click', close);
            }

            showCustomConfirm(title, desc, callback) {
                this.promptTitle.innerText = title;
                this.promptTitle.style.color = '#ef476f';
                this.promptDesc.innerText = desc;
                this.promptInput.style.display = 'none'; 
                
                this.promptConfirm.className = 'prompt-btn prompt-btn-confirm';
                this.promptConfirm.style.background = '#ef476f';
                this.promptConfirm.style.boxShadow = '0 5px 20px rgba(239, 71, 111, 0.4)';
                
                this.promptOverlay.style.display = 'flex';

                const handleConfirm = () => {
                    close();
                    if (callback) callback();
                };

                const close = () => {
                    this.promptOverlay.style.display = 'none';
                    this.promptConfirm.removeEventListener('click', handleConfirm);
                    this.promptCancel.removeEventListener('click', close);
                    this.promptConfirm.style.background = '';
                    this.promptConfirm.style.boxShadow = '';
                };

                this.promptConfirm.addEventListener('click', handleConfirm);
                this.promptCancel.addEventListener('click', close);
            }

            switchSource(source) {
                this.currentSource = source;
                this.searchInput.value = '';
                this.suggestionsBox.style.display = 'none';
                
                if (source === 'RM') {
                    this.btnRM.classList.add('active'); this.btnFG.classList.remove('active');
                } else {
                    this.btnFG.classList.add('active'); this.btnRM.classList.remove('active');
                }
            }

            getDatabaseBySource() {
                let db = [];
                if (this.currentSource === 'RM') {
                    try {
                        const frameA = document.getElementById('frame-a').contentWindow;
                        const rmInventory = frameA.eval('AppState.inventory');
                        if (rmInventory) {
                            db = rmInventory.map(item => ({
                                name: item.name || 'Unknown',
                                code: item.code || 'N/A',
                                searchStr: (item.searchableText || item.name + ' ' + item.code).toLowerCase()
                            }));
                        }
                    } catch(e) {}
                } else {
                    try {
                        const frameB = document.getElementById('frame-b').contentWindow;
                        const fgInventory = frameB.eval('app.db');
                        if (fgInventory) {
                            db = fgInventory.map(item => ({
                                name: item.name || 'Unknown',
                                code: item.code || 'N/A',
                                searchStr: (item.searchIndex || item.name + ' ' + item.code).toLowerCase()
                            }));
                        }
                    } catch(e) {}
                }
                return db;
            }

            handleSearch(query) {
                query = query.toLowerCase().trim();
                this.suggestionsBox.innerHTML = '';
                
                if (!query) {
                    this.suggestionsBox.style.display = 'none';
                    return;
                }

                const searchTerms = query.split(/\s+/).filter(term => term.length > 0);
                const liveDatabase = this.getDatabaseBySource();
                
                const matches = liveDatabase.filter(p => {
                    return searchTerms.every(term => p.searchStr.includes(term));
                });

                if (matches.length > 0) {
                    this.suggestionsBox.style.display = 'block';
                    matches.forEach(match => {
                        let div = document.createElement('div');
                        div.className = 'suggestion-item';
                        div.innerHTML = `
                            <span class="sugg-name">${match.name}</span> 
                            <span class="sugg-code">${match.code}</span>
                        `;
                        div.addEventListener('click', () => this.promptQuantity(match.name, match.code));
                        this.suggestionsBox.appendChild(div);
                    });
                } else {
                    this.suggestionsBox.style.display = 'none';
                }
            }

            promptQuantity(productName, productCode) {
                this.showCustomPrompt(
                    "ASSIGN QUANTITY",
                    `<span style="color:#fff;">${productName}</span><br><span style="color:var(--neon-blue); font-family:monospace;">${productCode}</span>`,
                    "e.g., 2pc, 100ml...",
                    false,
                    (qty) => {
                        this.cart.push({ name: `${productName} [${productCode}]`, quantity: qty });
                        this.updateCartUI();
                        this.searchInput.value = '';
                        this.suggestionsBox.style.display = 'none';
                    }
                );
            }

            updateCartUI() {
                this.cartList.innerHTML = '';
                this.cart.forEach(item => {
                    let li = document.createElement('li');
                    li.className = 'sc-list-item';
                    li.innerHTML = `<span class="cart-name">${item.name}</span> <span class="cart-qty">${item.quantity}</span>`;
                    this.cartList.appendChild(li);
                });
                
                if (this.cart.length > 0) {
                    this.cartContainer.style.display = 'block';
                } else {
                    this.cartContainer.style.display = 'none';
                }
            }

            finaliseOrder() {
                this.showCustomPrompt(
                    "FINALISE PAYLOAD",
                    "Identify Target Entity (Customer Name)",
                    "Customer Name...",
                    true,
                    (customerName) => {
                        const newOrder = {
                            id: Date.now(),
                            dateTime: new Date().toLocaleDateString('en-GB') + ' ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }),
                            customer: customerName,
                            items: [...this.cart] 
                        };
                        this.savedOrders.push(newOrder);
                        localStorage.setItem('sample_orders_db', JSON.stringify(this.savedOrders));
                        this.cart = [];
                        this.updateCartUI();
                        this.renderSavedOrders();
                    }
                );
            }

            renderSavedOrders() {
                this.savedTableBody.innerHTML = '';
                let displayOrders = [...this.savedOrders].reverse();
                displayOrders.forEach(order => {
                    let itemsString = order.items.map(i => `${i.name} (<strong style="color:var(--neon-green);">${i.quantity}</strong>)`).join('<br>');
                    let tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td style="color: #888; font-family:monospace;">${order.dateTime}</td>
                        <td style="font-weight: 800; color: #fff;">${order.customer}</td>
                        <td style="line-height: 1.6; color: #ccc;">${itemsString}</td>
                    `;
                    this.savedTableBody.appendChild(tr);
                });
            }

            async exportToExcel() {
                if (this.savedOrders.length === 0) return;
                
                let exportData = [];
                let latestCustomer = "Entity";
                
                if (this.savedOrders.length > 0) {
                    latestCustomer = this.savedOrders[this.savedOrders.length - 1].customer.replace(/[^a-zA-Z0-9 ]/g, "").trim();
                }

                this.savedOrders.forEach(order => {
                    order.items.forEach(item => {
                        exportData.push([
                            order.dateTime,
                            order.customer,
                            item.name,
                            item.quantity
                        ]);
                    });
                });

                const workbook = new ExcelJS.Workbook();
                const worksheet = workbook.addWorksheet('Transmissions');

                worksheet.addTable({
                    name: 'PayloadTable',
                    ref: 'A1',
                    headerRow: true,
                    totalsRow: false,
                    style: { theme: 'TableStyleDark2', showRowStripes: true },
                    columns: [
                        { name: 'Timestamp', filterButton: true },
                        { name: 'Target Entity', filterButton: true },
                        { name: 'Payload Data', filterButton: true },
                        { name: 'Quantity', filterButton: true },
                    ],
                    rows: exportData,
                });

                worksheet.columns.forEach(column => {
                    let maxLength = 0;
                    column.eachCell({ includeEmpty: true }, cell => {
                        let columnLength = cell.value ? cell.value.toString().length : 10;
                        if (columnLength > maxLength) maxLength = columnLength;
                    });
                    column.width = maxLength + 3; 
                });

                await worksheet.protect('zz', {
                    selectLockedCells: true, selectUnlockedCells: true,
                    formatCells: false, formatColumns: false, formatRows: false,
                    insertColumns: false, insertRows: false, deleteColumns: false,
                    deleteRows: false, sort: false, autoFilter: true 
                });

                const buffer = await workbook.xlsx.writeBuffer();
                const dateStr = new Date().toLocaleDateString('en-GB').replace(/\//g, '-');
                const fileName = `${latestCustomer} Samples ${dateStr}.xlsx`;
                
                const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = fileName;
                link.click();
            }

            clearHistory() {
                this.showCustomConfirm(
                    "PURGE LOGS",
                    "Warning: This will permanently erase all local transmission logs. Proceed?",
                    () => {
                        this.savedOrders = [];
                        localStorage.removeItem('sample_orders_db');
                        this.renderSavedOrders();
                    }
                );
            }
        }

        const sampleApp = new SampleCartApp();
    </script>
</body>
</html>
